services:
  db:
    image: postgres:16-alpine
    container_name: wentric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wentric}
      POSTGRES_USER: ${POSTGRES_USER:-wentric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wentric_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wentric} -d ${POSTGRES_DB:-wentric}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wentric_pg_data:
